name: Secure CI Pipeline (SAST & DAST)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  # JOB 1: Static Application Security Testing (Code Scanning)
  sast-testing:
    name: Run SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Semgrep Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript

  # JOB 2: Pull Published Image, Run Health Test & DAST Scan
  dast-testing:
    name: Run DAST & Integration Tests
    needs: sast-testing
    runs-on: ubuntu-latest

    steps:
      - name: Start Application Container
        # Pulls and runs your exact production image from Docker Hub automatically
        run: |
          docker run -d \
            --name app-under-test \
            -p 3000:3000 \
            vineet2804/your-app-repo:latest

      - name: Wait for Application Readiness
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:3000/health | grep -q '"status":"ok"'; then
              echo "Application is up and healthy!"
              exit 0
            fi
            echo "Waiting for app to start..."
            sleep 2
          done
          echo "Error: Health check timed out."
          exit 1

      - name: Verify Root Endpoint Text
        run: |
          RESPONSE=$(curl --fail --silent http://localhost:3000/)
          echo "App Response: $RESPONSE"
          if [[ "$RESPONSE" != *"Your IP is"* ]]; then
            echo "Failed: Root endpoint did not return correct IP structure."
            exit 1
          fi

      # JOB 2 (Continued): Dynamic Security Scan against the production container image
      - name: OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:3000/'
          fail_action: false # Keeps the build passing even if non-critical headers are missing

      - name: Diagnostic Dump on Failure
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker ps -a
          echo "=== Container Logs ==="
          docker logs app-under-test || true

      - name: Clean Up Container
        if: always()
        run: docker rm -f app-under-test || true
